<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segundo site</title>
    <link rel="stylesheet" href="style.css">
</head>
<body onload="carregar()">
    <header>
    <h1 class="titulo" id="Formulario-white">Formulário</h1>
    <h2 class="titulo" id="saudacao"></h2>
    </header>

    <section>
        <form id="meufor">
            <div class="center">
            <input type="text" id="nome" placeholder="Nome" required> <br> <br>
            </div>

            <div class="center">
            <input type="text" id="sobrenome" placeholder="Sobrenome" required> <br> <br>
            </div>

            <div class="center">
            <input type="email" id="email" placeholder="seu email" required> <br> <br>
            </div>

            <div class="center">
            <input type="number" id="idade" min="0" max="100" placeholder="idade" required> <br>
            </div>

            <div class="center">
                <label>
                    <p>Qual o seu gênero ?</p>
                    <input type="radio" id="G-masculino" name="genero" checked>Masculino
                    <input type="radio" id="G-feminino" name="genero">Feminino
                    <input type="radio" id="G-outro" name="genero">Outro
                </label>
            </div> <br>

            <div class="center">
            <input type="text" id="cpf" maxlength="11" placeholder="seu CPF" required> <br>
            </div>
            
            <div class="center">
            <button type="button" onclick="agir()">Enviar</button>
            <button type="button" onclick="limparformulario()">Limpar</button>
            </div>
        </form>
        <footer>
            <p class="center">© 2026 
                <span>Fundação Freitas </span>
                
                </p> <!--Empresa fictícia-->
        </footer>
    </section>
    
    <div id="Resultado" class="center"></div> <br>
    <div id="genero_selecionado" class="center"></div>
    <script src="script2.js"></script>
    <noscript>
        <p>Este site funciona melhor com javascript.</p>
    </noscript>
</body>
</html>
