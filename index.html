<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segundo site</title>
    <link rel="stylesheet" href="style.css">
</head>
<body onload="carregar()">
    <header>
    <h1 class="titulo" id="Formulario-white">Formulário</h1>
    </header>

    <section>
        <form>
        <label id="Nome-white">Nome:</label> <br>
            <input type="text" id="nome" placeholder="seu nome" required> <br> <br>
        <label id="Sobrenome-white">Sobrenome:</label> <br>
            <input type="text" id="sobrenome" placeholder="seu Sobrenome" required> <br> <br>
        <label id="Email-white">Email:</label> <br>
            <input type="email" id="email" placeholder="seu email" required> <br> <br>
        <label id="Idade-white">Idade:</label> <br>
            <input type="number" id="idade" min="0" max="100" placeholder="sua idade" required> <br> <br>
        <label id="CPF-white">CPF:</label> <br>
            <input type="text" id="cpf" maxlength="11" placeholder="seu CPF" required> <br>
        <p>Qual o seu gênero?</p>
        <input type="radio" name="genero" value="masculino"> Masculino <br>
        <input type="radio" name="genero" value="feminino"> feminino <br>
            <button type="button" onclick="agir()">Enviar</button>
        </form>
    </section>
    
    <div id="Resultado"></div>
    <script src="script2.js"></script>
</body>
</html>
