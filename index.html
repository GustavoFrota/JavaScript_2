<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segundo site</title>
    <link rel="stylesheet" href="style.css">
</head>
<body onload="carregar()">
    <header>
    <h1 class="titulo">Formulário</h1>
    </header>
    <section>
        <div>Nome:</div> <br>
        <div>
            <input type="text" id="nome" placeholder="seu nome" required> <br>
        </div>
        <div>Sobrenome:</div> <br>
        <div>
            <input type="text" id="Sobrenome" placeholder="seu Sobrenome" required> <br>
        </div>
        <div>Email:</div> <br>
        <div>
            <input type="email" id="email" placeholder="seu email" required> <br>
        </div>
        <div>Idade:</div> <br>
        <div>
            <input type="number" id="idade" min="0" max="100" placeholder="sua idade" required> <br>
        </div>
        <div>CPF:</div> <br>
        <div>
            <input type="number" id="cpf" max="11" placeholder="seu CPF" required> <br>
        </div>
        <div class="divs">
            <button type="button" onclick="agir()">Enviar</button>
        </div>
    </section>
    <div id="Resultado" class="divs"></div>
    <script src="script2.js"></script>
</body>
</html>
